<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Privacy Policy — Foondly</title>
  <meta name="description" content="Your trust matters. Here's exactly what Foondly collects, how we use it, and the control you have over your data." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset ────────────────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    /* ── Brand tokens (from colors.ts) ───────────────── */
    :root {
      --primary:        #F0364A;
      --primary-light:  #FFD4DA;
      --primary-dark:   #C42438;
      --secondary:      #FF9240;
      --accent:         #F5EDD6;
      --bg:             #FFF7F5;
      --bg-alt:         #FFF0EC;
      --card:           #FFFFFF;
      --card-border:    #F5E0DC;
      --text-primary:   #2A1018;
      --text-secondary: #7A5058;
      --text-muted:     #AA8890;
    }

    /* ── Base ─────────────────────────────────────────── */
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Page wrapper ────────────────────────────────── */
    .page {
      max-width: 680px;
      margin: 0 auto;
      padding: 60px 24px 48px;
    }

    /* ── Navigation ──────────────────────────────────── */
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }
    .back-btn {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      cursor: pointer;
      border-radius: 12px;
      transition: background 0.2s;
    }
    .back-btn:hover { background: var(--bg-alt); }
    .back-btn svg { stroke: var(--text-secondary); }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .logo-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    /* Tiny heart shape inside the logo icon */
    .logo-icon::after {
      content: '';
      width: 12px;
      height: 12px;
      background: var(--accent);
      border-radius: 50% 50% 0 50%;
      transform: rotate(-45deg);
      opacity: 0.85;
    }
    .logo-wordmark {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.5px;
    }
    .nav-spacer { width: 40px; }

    /* ── Header ───────────────────────────────────────── */
    .header { margin-bottom: 24px; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--primary-light);
      border-radius: 100px;
      padding: 6px 12px;
      margin-bottom: 12px;
    }
    .badge svg { stroke: var(--primary); width: 13px; height: 13px; }
    .badge-text {
      font-size: 12px;
      font-weight: 700;
      color: var(--primary-dark);
      letter-spacing: 0.3px;
    }

    .title {
      font-size: 28px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 22px;
    }

    /* ── Card ─────────────────────────────────────────── */
    .card {
      background: var(--card);
      border-radius: 20px;
      border: 1px solid var(--card-border);
      padding: 20px;
      box-shadow: 0 2px 8px rgba(42, 16, 24, 0.05);
    }

    .section { padding: 14px 0; }
    .section:not(:last-child) { border-bottom: 1px solid var(--card-border); }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    .section-body {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 22px;
    }

    /* ── Footer ───────────────────────────────────────── */
    .updated {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 20px;
    }

    /* ── Responsive polish ────────────────────────────── */
    @media (max-width: 480px) {
      .page { padding: 40px 16px 36px; }
      .title { font-size: 24px; }
    }

    /* ── Subtle entrance animation ────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .header { animation: fadeUp 0.5s ease both; }
    .card   { animation: fadeUp 0.5s ease 0.1s both; }
    .updated { animation: fadeUp 0.5s ease 0.2s both; }
  </style>
</head>
<body>
  <main class="page">

    <!-- Navigation -->
    <nav class="nav">
      <button class="back-btn" onclick="history.back()" aria-label="Go back">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
             fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5" /><path d="m12 19-7-7 7-7" />
        </svg>
      </button>

      <a href="/" class="logo">
        <span class="logo-icon"></span>
        <span class="logo-wordmark">foondly</span>
      </a>

      <span class="nav-spacer"></span>
    </nav>

    <!-- Header -->
    <header class="header">
      <div class="badge">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24"
             fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
        </svg>
        <span class="badge-text">Your privacy</span>
      </div>
      <h1 class="title">Privacy Policy</h1>
      <p class="subtitle">Your trust matters. Here&#8217;s exactly what we collect, how we use it, and the control you have.</p>
    </header>

    <!-- Policy Sections -->
    <div class="card" id="policy-sections"></div>

    <p class="updated">Last updated: August 4, 2026</p>
  </main>

  <script>
    const sections = [
      {
        title: 'Information we collect',
        body: 'When you create an account, we collect your name and email address. As you use Foondly, we store the conversations, perspectives, and AI-generated verdicts you create within your account.',
      },
      {
        title: 'How we use your information',
        body: 'We use your information to provide and improve the app: to generate AI insights, to remember your rooms and sessions, and to communicate with you about your account. We do not sell your personal data to third parties.',
      },
      {
        title: 'AI processing',
        body: 'Your conversations and perspectives are sent to our AI providers to generate verdicts and coaching responses. These providers process data on our behalf and are contractually prohibited from using it to train their models.',
      },
      {
        title: 'Data storage and security',
        body: 'Your data is stored securely with our database provider. We use row-level security so that only you can access your own conversations and account information. Passwords are hashed and never stored in plain text.',
      },
      {
        title: 'Data retention',
        body: 'We keep your data for as long as your account is active. You can delete your account at any time, which permanently removes your conversations, rooms, and personal information.',
      },
      {
        title: 'Third-party services',
        body: 'We rely on trusted third-party providers for authentication, database hosting, and AI processing. Each provider has its own privacy practices, and we only share the minimum data needed to deliver the service.',
      },
      {
        title: 'Your rights',
        body: 'You can view, update, or delete your account information at any time. If you have questions about your data or want to request export or deletion, contact us at privacy@foondly.app.',
      },
      {
        title: 'Children\u2019s privacy',
        body: 'Foondly is not intended for use by anyone under 18 years of age. We do not knowingly collect information from children.',
      },
      {
        title: 'Changes to this policy',
        body: 'We may update this privacy policy from time to time. When we do, we will revise the date at the bottom of this page and, for significant changes, notify you within the app or by email.',
      },
    ];

    const card = document.getElementById('policy-sections');
    sections.forEach((s, i) => {
      const section = document.createElement('div');
      section.className = 'section';
      section.innerHTML = `
        <h2 class="section-title">${s.title}</h2>
        <p class="section-body">${s.body}</p>
      `;
      card.appendChild(section);
    });
  </script>
</body>
</html>
